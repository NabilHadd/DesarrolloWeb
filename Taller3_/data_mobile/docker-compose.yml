version: "3.9"

services:
  db:
    image: postgres:16
    container_name: data_mobile_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: data_mobile
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: NEXT_APP
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:123@db:5432/data_mobile
      NODE_ENV: production
    ports:
      - "3000:3000"
      
volumes:
  db_data: